[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'aarch64-linux-gnu-pkg-config'
wayland-scanner = '/usr/bin/wayland-scanner'

[built-in options]
c_args = ['-mcpu=cortex-a76.cortex-a55', '-O2', '--sysroot=/opt/sysroot']
cpp_args = ['-mcpu=cortex-a76.cortex-a55', '-O2', '--sysroot=/opt/sysroot']
c_link_args = ['--sysroot=/opt/sysroot', '-Wl,-rpath-link,/opt/sysroot/usr/lib/aarch64-linux-gnu']
cpp_link_args = ['--sysroot=/opt/sysroot', '-Wl,-rpath-link,/opt/sysroot/usr/lib/aarch64-linux-gnu']

[properties]
sys_root = '/opt/sysroot'
pkg_config_libdir = '/opt/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot/usr/share/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a76'
endian = 'little'
