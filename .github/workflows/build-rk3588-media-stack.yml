name: Build Full RK3588 Media Stack (.deb) for Ubuntu 26.10

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SYSROOT: /opt/sysroot
  DEB_OUT: /opt/debs
  UBUNTU_CODENAME: stonking

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host cross-build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config mmdebstrap qemu-user qemu-user-binfmt \
            rustc cargo llvm-dev libclang-dev libclc-22-dev \
            meson ninja-build python3-mako python3-yaml glslang-tools \
            wayland-protocols libwayland-bin flex bison git cmake nasm dpkg-dev curl ca-certificates
          DEBIAN_FRONTEND=noninteractive apt-get install -y bindgen || cargo install bindgen-cli
          if [ -x "$HOME/.cargo/bin/bindgen" ]; then
            ln -sf "$HOME/.cargo/bin/bindgen" /usr/local/bin/bindgen
          fi
          SPIRV_TRANS_PKG=$(apt-cache search --names-only '^libspirv-llvm-translator-.*-dev$' | awk '{print $1}' | sort -V | tail -n 1)
          if [ -n "$SPIRV_TRANS_PKG" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y "$SPIRV_TRANS_PKG"
          fi

      - name: Generate Meson Cross-File
        run: |
          cat <<'EOF' > rk3588-ubuntu2610.ini
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = '/usr/bin/pkg-config'
          wayland-scanner = '/usr/bin/wayland-scanner'
          mesa_clc = '/usr/local/bin/mesa_clc'
          rust = ['rustc', '--target=aarch64-unknown-linux-gnu', '-C', 'link-arg=--sysroot=/opt/sysroot']
          rust_ld = 'aarch64-linux-gnu-gcc'

          [built-in options]
          c_args = ['-mcpu=cortex-a76.cortex-a55', '-O2', '--sysroot=/opt/sysroot']
          cpp_args = ['-mcpu=cortex-a76.cortex-a55', '-O2', '--sysroot=/opt/sysroot']
          c_link_args = ['--sysroot=/opt/sysroot', '-Wl,-rpath-link,/opt/sysroot/usr/lib/aarch64-linux-gnu']
          cpp_link_args = ['--sysroot=/opt/sysroot', '-Wl,-rpath-link,/opt/sysroot/usr/lib/aarch64-linux-gnu']

          [properties]
          sys_root = '/opt/sysroot'
          pkg_config_libdir = '/opt/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot/usr/share/pkgconfig'
          needs_exe_wrapper = true

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a76'
          endian = 'little'
          EOF

      - name: Create ARM64 Ubuntu 26.10 Sysroot
        run: |
          mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
          /usr/lib/systemd/systemd-binfmt || true
          mkdir -p $SYSROOT $DEB_OUT
          mmdebstrap --arch=arm64 --variant=minbase \
            --components=main,universe \
            --include=libc6-dev,libstd-rust-dev,libdrm-dev,libudev-dev,libwayland-dev,libwayland-egl-backend-dev,libx11-dev,libxext-dev,libxfixes-dev,libxcb-glx0-dev,libxcb-shm0-dev,libx11-xcb-dev,libxcb-dri2-0-dev,libxcb-dri3-dev,libxcb-present-dev,libxshmfence-dev,libxxf86vm-dev,libxrandr-dev,libelf-dev,libexpat1-dev,zlib1g-dev,libzstd-dev,libass-dev,libfreetype-dev,libfontconfig-dev,libfribidi-dev,libharfbuzz-dev,libplacebo-dev,libvulkan-dev,libpulse-dev,libasound2-dev,libpipewire-0.3-dev,libsdl2-dev \
            $UBUNTU_CODENAME $SYSROOT http://ports.ubuntu.com/ubuntu-ports
          find $SYSROOT -lname '/*' -exec sh -c 'ln -snf "$SYSROOT$(readlink "$1")" "$1"' _ {} \;
          HOST_RUSTLIB="$(rustc --print sysroot)/lib/rustlib"
          TARGET_RUSTLIB=$(find $SYSROOT/usr/lib -type d -name "aarch64-unknown-linux-gnu" | grep rustlib | head -n 1)
          mkdir -p "$HOST_RUSTLIB"
          ln -snf "$TARGET_RUSTLIB" "$HOST_RUSTLIB/aarch64-unknown-linux-gnu"

      - name: Package Mali-G610 CSF Firmware (Panthor)
        run: |
          PKG_DIR=/tmp/pkg-fw
          mkdir -p $PKG_DIR/lib/firmware/arm/mali/arch10.8
          curl -fL --retry 3 --connect-timeout 15 \
            "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/arm/mali/arch10.8/mali_csffw.bin" \
            -o $PKG_DIR/lib/firmware/arm/mali/arch10.8/mali_csffw.bin

          FW_VER=$(date +%Y%m%d)
          mkdir -p $PKG_DIR/DEBIAN
          cat <<EOF > $PKG_DIR/DEBIAN/control
          Package: firmware-mali-rk3588
          Version: ${FW_VER}-1rk3588
          Architecture: arm64
          Maintainer: RK3588 Builder <builder@local>
          Description: Mali-G610 CSF firmware (mali_csffw.bin) for Panthor DRM driver on RK3588
          EOF
          dpkg-deb --build --root-owner-group $PKG_DIR $DEB_OUT/firmware-mali-rk3588_${FW_VER}_arm64.deb

      - name: Build and Package Mesa (Panfrost / Panthor)
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git /tmp/mesa
          MESA_BASE=$(cat /tmp/mesa/VERSION | tr -d '\n' | sed 's/-devel//')
          MESA_HASH=$(git -C /tmp/mesa rev-parse --short HEAD)
          MESA_VER="${MESA_BASE}+git${MESA_HASH}"
          PKG_DIR=/tmp/pkg-mesa

          # Build native mesa_clc on host (x86_64) for PanVK shader precompilation
          if ! DEBIAN_FRONTEND=noninteractive apt-get install -y mesa-clc; then
            meson setup /tmp/mesa/build-host /tmp/mesa \
              --prefix=/usr/local \
              --buildtype=release \
              -Dmesa-clc=enabled \
              -Dinstall-mesa-clc=true \
              -Dgallium-drivers= \
              -Dvulkan-drivers= \
              -Dplatforms= \
              -Dglx=disabled \
              -Degl=disabled \
              -Dgbm=disabled \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dopengl=false
            meson compile -C /tmp/mesa/build-host
            meson install -C /tmp/mesa/build-host
          fi
          ln -snf "$(command -v mesa_clc)" /usr/local/bin/mesa_clc || true

          meson setup /tmp/mesa/build /tmp/mesa \
            --cross-file rk3588-ubuntu2610.ini \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            --buildtype=release \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=panfrost,softpipe \
            -Dvulkan-drivers=panfrost \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dllvm=disabled \
            -Dmesa-clc=system \
            -Dglx=dri
          meson compile -C /tmp/mesa/build
          DESTDIR=$SYSROOT meson install -C /tmp/mesa/build
          DESTDIR=$PKG_DIR meson install -C /tmp/mesa/build

          mkdir -p $PKG_DIR/DEBIAN
          cat <<EOF > $PKG_DIR/DEBIAN/control
          Package: mesa-rk3588
          Version: ${MESA_VER}-1rk3588
          Architecture: arm64
          Maintainer: RK3588 Builder <builder@local>
          Depends: firmware-mali-rk3588, libdrm2, libwayland-client0, libwayland-server0, libexpat1, zlib1g, libzstd1
          Provides: libgl1-mesa-dri, libegl-mesa0, libgbm1, mesa-vulkan-drivers
          Replaces: libgl1-mesa-dri, libegl-mesa0, libgbm1, mesa-vulkan-drivers
          Description: Mesa 3D graphics library with Panfrost/Panthor support for RK3588
          EOF
          dpkg-deb --build --root-owner-group $PKG_DIR $DEB_OUT/mesa-rk3588_${MESA_VER}_arm64.deb

      - name: Build and Package FFmpeg (V4L2 Request API)
        run: |
          git clone --depth 1 --branch v4l2request-v3 https://code.ffmpeg.org/Kwiboo/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg
          FFMPEG_BASE=$(cat RELEASE | sed 's/[^0-9.].*//')
          FFMPEG_HASH=$(git rev-parse --short HEAD)
          FFMPEG_VER="${FFMPEG_BASE:-7.1}+git${FFMPEG_HASH}"
          PKG_DIR=/tmp/pkg-ffmpeg

          export PKG_CONFIG_PATH="$SYSROOT/usr/lib/aarch64-linux-gnu/pkgconfig:$SYSROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT"

          ./configure \
            --enable-cross-compile \
            --cross-prefix=aarch64-linux-gnu- \
            --arch=aarch64 \
            --target-os=linux \
            --sysroot=$SYSROOT \
            --prefix=/usr \
            --libdir=/usr/lib/aarch64-linux-gnu \
            --cpu=cortex-a76 \
            --extra-cflags="-mcpu=cortex-a76.cortex-a55 -O2" \
            --enable-shared \
            --disable-static \
            --enable-gpl \
            --enable-version3 \
            --enable-libdrm \
            --enable-libudev \
            --enable-v4l2-request \
            --enable-v4l2-m2m \
            --enable-vulkan \
            --enable-libass \
            --enable-libfreetype \
            --enable-libfontconfig \
            --enable-libharfbuzz
          make -j$(nproc)
          make DESTDIR=$SYSROOT install
          make DESTDIR=$PKG_DIR install

          mkdir -p $PKG_DIR/DEBIAN
          cat <<EOF > $PKG_DIR/DEBIAN/control
          Package: ffmpeg-rk3588
          Version: ${FFMPEG_VER}-1rk3588
          Architecture: arm64
          Maintainer: RK3588 Builder <builder@local>
          Depends: mesa-rk3588, libdrm2, libudev1, libass9, libfreetype6, libfontconfig1, libharfbuzz0b
          Provides: ffmpeg, libavcodec-dev, libavformat-dev, libavutil-dev, libswscale-dev
          Replaces: ffmpeg
          Description: FFmpeg with V4L2 Request API hardware acceleration for RK3588 Linux 7.3
          EOF
          dpkg-deb --build --root-owner-group $PKG_DIR $DEB_OUT/ffmpeg-rk3588_${FFMPEG_VER}_arm64.deb

      - name: Build and Package MPV with RK3588 Default Config
        run: |
          git clone --depth 1 https://github.com/mpv-player/mpv.git /tmp/mpv
          MPV_BASE=$(cat /tmp/mpv/VERSION | tr -d '\n' | sed 's/[^0-9.].*//')
          MPV_HASH=$(git -C /tmp/mpv rev-parse --short HEAD)
          MPV_VER="${MPV_BASE:-0.40.0}+git${MPV_HASH}"
          PKG_DIR=/tmp/pkg-mpv

          meson setup /tmp/mpv/build /tmp/mpv \
            --cross-file rk3588-ubuntu2610.ini \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            --buildtype=release \
            -Dlibmpv=true \
            -Dwayland=enabled \
            -Dx11=enabled \
            -Ddrm=enabled \
            -Degl=enabled \
            -Degl-drm=enabled \
            -Degl-wayland=enabled \
            -Dvulkan=enabled \
            -Dgl=enabled
          meson compile -C /tmp/mpv/build
          DESTDIR=$PKG_DIR meson install -C /tmp/mpv/build

          mkdir -p $PKG_DIR/etc/mpv
          cat <<'EOF' > $PKG_DIR/etc/mpv/mpv.conf
          hwdec=v4l2request
          hwdec-codecs=all
          vo=gpu
          gpu-api=opengl
          gpu-hwdec-interop=drmprime-drm
          gpu-context=auto
          profile=fast
          vd-lavc-threads=4
          EOF

          mkdir -p $PKG_DIR/DEBIAN
          cat <<'EOF' > $PKG_DIR/DEBIAN/conffiles
          /etc/mpv/mpv.conf
          EOF
          cat <<EOF > $PKG_DIR/DEBIAN/control
          Package: mpv-rk3588
          Version: ${MPV_VER}-1rk3588
          Architecture: arm64
          Maintainer: RK3588 Builder <builder@local>
          Depends: mesa-rk3588, ffmpeg-rk3588, libplacebo349 | libplacebo-dev, libwayland-client0, libasound2t64 | libasound2, libpulse0
          Provides: mpv, libmpv2
          Replaces: mpv
          Description: MPV media player built with V4L2-Request FFmpeg and Panfrost Mesa
          EOF
          dpkg-deb --build --root-owner-group $PKG_DIR $DEB_OUT/mpv-rk3588_${MPV_VER}_arm64.deb

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-ubuntu2610-debs
          path: /opt/debs/*.deb
